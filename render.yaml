services:
  - type: web
    name: pg-management
    runtime: docker
    repo: https://github.com/rajsojitra11/pg_management
    branch: main
    dockerfilePath: ./Dockerfile
    plan: free

    envVars:
      # Application
      - key: APP_NAME
        value: "PG Management"

      - key: APP_ENV
        value: production

      - key: APP_DEBUG
        value: "false"

      - key: APP_URL
        fromService:
          type: web
          name: pg-management
          envVarKey: RENDER_EXTERNAL_URL

      - key: APP_KEY
        sync: false

      - key: APP_TIMEZONE
        value: Asia/Kolkata

      - key: LOG_CHANNEL
        value: stderr

      # Database
      - key: DB_CONNECTION
        value: pgsql

      - key: DB_HOST
        fromDatabase:
          name: pgmanagement_db_91gf
          property: host

      - key: DB_PORT
        fromDatabase:
          name: pgmanagement_db_91gf
          property: port

      - key: DB_DATABASE
        fromDatabase:
          name: pgmanagement_db_91gf
          property: database

      - key: DB_USERNAME
        fromDatabase:
          name: pgmanagement_db_91gf
          property: user

      - key: DB_PASSWORD
        fromDatabase:
          name: pgmanagement_db_91gf
          property: password

      - key: DB_SSLMODE
        value: require

      # Laravel
      - key: SESSION_DRIVER
        value: database

      - key: CACHE_STORE
        value: database

      - key: QUEUE_CONNECTION
        value: database

      - key: FILESYSTEM_DISK
        value: public

      # Company
      - key: COMPANY_NAME
        value: PG Management

      - key: COMPANY_ADDRESS
        value: "14/A Lohanagar, Nr. Pavagadhi Estate, B/h Passport Office, Gondal Road, Rajkot"

      - key: INSTALL_TYPE
        value: default

      # Mail
      - key: MAIL_MAILER
        value: smtp

      - key: MAIL_HOST
        sync: false

      - key: MAIL_PORT
        sync: false

      - key: MAIL_USERNAME
        sync: false

      - key: MAIL_PASSWORD
        sync: false

      - key: MAIL_ENCRYPTION
        sync: false

      - key: MAIL_FROM_ADDRESS
        sync: false

      - key: MAIL_FROM_NAME
        value: PG Management

databases:
  - name: pgmanagement_db_91gf
    plan: free
    databaseName: pgmanagement_db_91gf
    user: pgmanagement_db_91gf_user
    postgresMajorVersion: 16